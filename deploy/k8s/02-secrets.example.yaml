# EXAMPLE ONLY -- placeholder values, not real secrets. Do not
# `kubectl apply -f` this file as-is against anything but a scratch
# cluster; replace every value below (or better, generate this Secret
# via a sealed-secrets/external-secrets controller, or
# `kubectl create secret generic ... --from-literal=...` directly
# against the cluster, so it never touches git in cleartext).
apiVersion: v1
kind: Secret
metadata:
  name: haie-provider-keys
  namespace: haie
type: Opaque
stringData:
  # Only read when LLM_PROVIDER / EMBEDDING_PROVIDER (01-configmap.yaml)
  # are set to "openai" -- see app/config/settings.py's
  # RagSettings.from_env / RetrievalSettings.from_env.
  OPENAI_API_KEY: "CHANGE-ME"
  LLM_API_KEY: "CHANGE-ME"
---
# The API's auth store (app/auth/users.py) reads a JSON file of
# {api_key, username, role, enabled} records via AUTH_USERS_FILE
# (01-configmap.yaml) -- mounted from this Secret as a file, not an
# env var, since it's a small file rather than a single scalar value.
# validate_production_readiness() rejects the "change-me"/"example-key"
# markers below outside local/development/test, so these MUST be
# replaced with real rotated keys before this is used in staging or
# production -- see docs/operations/runbooks.md.
apiVersion: v1
kind: Secret
metadata:
  name: haie-auth-users
  namespace: haie
type: Opaque
stringData:
  users.json: |
    [
      {
        "api_key": "REPLACE-WITH-A-REAL-ROTATED-KEY-change-me",
        "username": "admin",
        "role": "administrator",
        "enabled": true
      }
    ]
