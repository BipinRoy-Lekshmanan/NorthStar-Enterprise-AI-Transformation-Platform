# API Deployment + Service.
#
# replicas: 1 is deliberate, not a placeholder to bump later without
# thought: haie-data (SQLite, ReadWriteOnce) and the local
# vector/workflow stores are single-writer. Scaling this past 1 would
# need, at minimum: DATABASE_URL pointed at a real multi-writer
# database (Postgres, etc.), a shared/networked vector store, and a
# shared workflow/evaluation store -- none of which this milestone
# adds, since Milestone 8's persistence scope was deliberately limited
# to genuinely new concerns (see the Milestone 8 plan's "Key
# architecture decisions" #1). The UI Deployment (05-ui.yaml) has no
# such constraint and runs 2 replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haie-api
  namespace: haie
  labels:
    app.kubernetes.io/name: haie-api
spec:
  replicas: 1
  strategy:
    type: Recreate
    # Not RollingUpdate: a second pod would briefly try to open the
    # same ReadWriteOnce PVCs (and the same SQLite file) as the pod
    # being replaced.
  selector:
    matchLabels:
      app.kubernetes.io/name: haie-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haie-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Replace with a real registry path once one exists for this
          # project (e.g. ghcr.io/<org>/haie-api:0.8.0); built but
          # not pushed anywhere by .github/workflows/ci.yml today.
          image: haie-api:0.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: haie-api-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: haie-provider-keys
                  key: OPENAI_API_KEY
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: haie-provider-keys
                  key: LLM_API_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: vector-store
              mountPath: /app/vector_store
            - name: workflow-store
              mountPath: /app/workflow_store
            - name: audit-log
              mountPath: /app/audit_log
            - name: evaluation-runs
              mountPath: /app/evaluation_runs
            - name: auth-users
              mountPath: /app/data/auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
              # readOnlyRootFilesystem needs this: app/operations/backup.py
              # uses tempfile.TemporaryDirectory() (OS temp dir) as
              # backup/restore staging space.
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: haie-data
        - name: vector-store
          persistentVolumeClaim:
            claimName: haie-vector-store
        - name: workflow-store
          persistentVolumeClaim:
            claimName: haie-workflow-store
        - name: audit-log
          persistentVolumeClaim:
            claimName: haie-audit-log
        - name: evaluation-runs
          persistentVolumeClaim:
            claimName: haie-evaluation-runs
        - name: auth-users
          secret:
            secretName: haie-auth-users
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: haie-api
  namespace: haie
spec:
  selector:
    app.kubernetes.io/name: haie-api
  ports:
    - name: http
      port: 8000
      targetPort: http
