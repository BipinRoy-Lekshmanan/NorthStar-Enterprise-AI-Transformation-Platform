# Milestone 8: CI pipeline. Every push to main and every pull request
# runs lint + security scan + the full test suite; a separate job
# builds both container images.
#
# mypy is advisory only (see pyproject.toml's [tool.mypy] comment --
# 7 milestones of code predate type-checking discipline, so failing
# the whole pipeline on pre-existing modules would be noise). Ruff,
# bandit, pip-audit, and pytest all block merges.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, security scan, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Docker runtime (python:3.11-slim) and
          # pyproject.toml's requires-python floor.
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: python -m ruff check .

      - name: Bandit (security scan)
        run: python -m bandit -c pyproject.toml -r app -q

      - name: pip-audit (dependency vulnerabilities)
        run: python -m pip_audit -r requirements.txt

      - name: pytest (full suite)
        run: python -m pytest -q

      - name: mypy (advisory -- does not block CI)
        continue-on-error: true
        run: python -m mypy app

  release-validate:
    name: Release readiness check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # Runs against the repo's own committed example credentials and
      # no APP_ENVIRONMENT override, so this always lands on
      # READY_WITH_WARNINGS (exit 0) in a correctly behaving checkout.
      # A non-zero exit here means something is actually broken (e.g.
      # the APP_VERSION/pyproject.toml drift app/release/validate.py
      # was built to catch), so -- unlike mypy -- this job blocks.
      - name: python -m app.release validate
        run: python -m app.release validate

  docker-build:
    name: Build container images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # This is the first REAL build verification these Dockerfiles
      # get. They were authored in a sandbox with no Docker installed
      # (Milestone 8, Task #111), where only static checks were
      # possible (COPY source paths exist, docker-compose.yml parses
      # as valid YAML). A GitHub Actions runner has Docker preinstalled,
      # so this job is the actual proof the images build.
      - name: Build API image
        run: docker build -f Dockerfile.api -t haie-api:ci .

      - name: Build UI image
        run: docker build -f Dockerfile.ui -t haie-ui:ci .

      # Images are built, not pushed -- there's no registry configured
      # for this portfolio project. Pushing to a real registry (GHCR,
      # ECR, etc.) is one `docker push` + a login step away once one
      # exists; adding it now would be speculative infrastructure this
      # milestone doesn't need.
